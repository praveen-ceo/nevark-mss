# =============================================================================
# Nevark MSS — Nginx Reverse Proxy Configuration
# Proxies HTTP traffic to frontend (Next.js) and backend (FastAPI)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # Upstream definitions (matches docker-compose service names)
    upstream nevark_backend {
        server backend:8000;
    }

    upstream nevark_frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # ── API — route to FastAPI ────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://nevark_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── FastAPI docs (only available when DEBUG=true in backend) ──────────
        location /docs {
            proxy_pass         http://nevark_backend/docs;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /redoc {
            proxy_pass         http://nevark_backend/redoc;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /openapi.json {
            proxy_pass         http://nevark_backend/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
        }

        # ── Health check passthrough ──────────────────────────────────────────
        location /health {
            proxy_pass http://nevark_backend/health;
        }

        # ── Next.js static assets (served directly by Next.js standalone) ─────
        location /_next/static/ {
            proxy_pass         http://nevark_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            # Long cache for immutable hashed assets
            proxy_cache_valid  200 365d;
            add_header         Cache-Control "public, max-age=31536000, immutable";
        }

        # ── All other traffic — frontend ──────────────────────────────────────
        location / {
            proxy_pass         http://nevark_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
