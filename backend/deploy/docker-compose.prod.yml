# =============================================================================
# Nevark MSS — Production Docker Compose
# Run from: D:\NMSS\backend\deploy\
# Usage:    docker compose -f docker-compose.prod.yml --env-file .env up -d
# =============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: nevark_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nevark_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Expose only on localhost for DBA access; remove in VPS-only deployments
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: nevark_redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - nevark_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: nevark_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - nevark_internal
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (backend access)
      - "127.0.0.1:9001:9001"   # Admin console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: nevark-mss-backend:latest
    container_name: nevark_backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV:              production
      DEBUG:                "false"
      DATABASE_URL:         postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:            redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL:    redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT:       minio:9000
      ALLOWED_ORIGINS:      '["http://${HOST_IP}", "http://localhost"]'
    networks:
      - nevark_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${HOST_IP}/api/v1
    image: nevark-mss-frontend:latest
    container_name: nevark_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - nevark_internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Reverse Proxy ────────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: nevark_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nevark_internal
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: nevark_postgres_data
  redis_data:
    name: nevark_redis_data
  minio_data:
    name: nevark_minio_data

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  nevark_internal:
    name: nevark_internal
    driver: bridge
