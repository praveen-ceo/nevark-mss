# =============================================================================
# Nevark MSS — Production Docker Compose
#
# Prerequisites:
#   - Docker Desktop (or Docker Engine + Compose plugin)
#   - A .env file copied from .env.example and filled in
#
# First run:
#   docker compose up -d --build
#
# Subsequent runs:
#   docker compose up -d
#
# Stop:
#   docker compose down
# =============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: nevark_redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - nevark_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:latest
    container_name: nevark_chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - nevark_internal
    environment:
      IS_PERSISTENT:        "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nevark-mss-backend:latest
    container_name: nevark_backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV:               production
      DEBUG:                 "false"
      DATABASE_URL:          ${DATABASE_URL}
      SUPABASE_URL:          ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MINIO_BUCKET_NAME:     ${MINIO_BUCKET_NAME:-nevark-mss}
      REDIS_URL:             redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL:     redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      CHROMA_HOST:           chromadb
      CHROMA_PORT:           "8000"
      ALLOWED_ORIGINS:       '["http://${HOST_IP}", "http://localhost"]'
    networks:
      - nevark_internal
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${HOST_IP}/api/v1
    image: nevark-mss-frontend:latest
    container_name: nevark_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - nevark_internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Reverse Proxy ─────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: nevark_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nevark_internal
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
    name: nevark_redis_data
  chroma_data:
    name: nevark_chroma_data

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  nevark_internal:
    name: nevark_internal
    driver: bridge
